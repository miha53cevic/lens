# Releases, with release-please. On every merge to main it keeps a release PR open that steps
# package.json's version and CHANGELOG.md from the conventional commits since the last release
# (fix: a patch, feat: a minor, a breaking change a major). Merging that PR tags v<version> and
# creates its GitHub Release; then the macOS app is packed with the same steps as on a Mac (the
# tests, then `bun run app:dist`) and its unsigned Lens.app, zipped, is attached to that release.
# macOS only for now: Forge packs for the system it runs on, so Windows would be a job of its own
# on a Windows runner.

name: macOS app

on:
  push:
    branches: [main]

permissions:
  # to tag and publish the release, and attach the app to it
  contents: write
  # to open and update the release PR
  pull-requests: write

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # reads release-please-config.json and .release-please-manifest.json
      - uses: googleapis/release-please-action@v4
        id: release

  build:
    # only when this push merged the release PR
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Apple silicon (arm64), like the README's release/Lens-darwin-arm64
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      - run: bun run test

      - run: bun run app:dist

      # ditto keeps the bundle's symlinks and its ad hoc signature, which a plain zip breaks
      - name: Zip Lens.app
        run: ditto -c -k --sequesterRsrc --keepParent release/Lens-darwin-arm64/Lens.app Lens-darwin-arm64.zip

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" Lens-darwin-arm64.zip
